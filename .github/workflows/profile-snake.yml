name: Update contribution snake

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-snake.yml

concurrency:
  group: profile-snake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b85e83&color_dots=#eff1f5,#ead7e1,#dba9bf,#bf7a99,#934f73
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e6a2bd&color_dots=#161b22,#342331,#61354c,#9e5d7d,#d896b2

      - name: Publish generated SVGs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const filenames = ['github-snake.svg', 'github-snake-dark.svg'];
            const blobs = await Promise.all(filenames.map(async name => {
              const content = await fs.readFile(`dist/${name}`, 'base64');
              const { data } = await github.rest.git.createBlob({ owner, repo, content, encoding: 'base64' });
              return { path: `assets/${name}`, mode: '100644', type: 'blob', sha: data.sha };
            }));

            for (let attempt = 0; attempt < 3; attempt++) {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
              const { data: parent } = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.object.sha });
              const { data: tree } = await github.rest.git.createTree({ owner, repo, base_tree: parent.tree.sha, tree: blobs });
              if (tree.sha === parent.tree.sha) {
                core.info('The contribution animations are already current.');
                return;
              }
              const { data: commit } = await github.rest.git.createCommit({
                owner, repo, message: 'Update contribution snake animations',
                tree: tree.sha, parents: [ref.object.sha]
              });
              try {
                await github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: commit.sha, force: false });
                return;
              } catch (error) {
                if (attempt === 2 || ![409, 422].includes(error.status)) throw error;
              }
            }
